<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      font-family: 'Press Start 2P', cursive;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #1f2f1f;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #ddd;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    #tutorialBox {
      position: fixed;
      top: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      border: 2px solid white;
      padding: 12px;
      font-size: 10px;
      z-index: 20;
      max-width: 260px;
      pointer-events: none;
      white-space: pre-line;
    }

    #tutorialBox h2 {
      margin: 0 0 8px 0;
      font-size: 12px;
    }

    #tutorialBox p {
      margin: 2px 0;
      font-size: 10px;
    }
  </style>
</head>

<div id="tutorialBox">
  <h2>CONTROLS</h2>
  <p>W → Move Forward</p>
  <p>S → Move Backward</p>
  <p>A → Move Left</p>
  <p>D → Move Right</p>
  <p>Mouse Click → Select a move during battle</p>
  <p style="margin-top: 8px; font-size: 9px">Press P to show / hide this tutorial</p>
</div>

<div style="display: inline-block; position: relative">
  <div
    id="overlappingDiv"
    style="
      background-color: black;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    "
  ></div>

  <canvas></canvas>
  <div
    id="characterDialogueBox"
    style="
      background-color: white;
      height: 140px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 4px black solid;
      display: none;
      padding: 12px;
    "
  ></div>

  <div id="userInterface" style="display: none">
    <!-- Represents health bar of draggle (enemy) -->
    <div
      style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 50px;
        left: 50px;
        border: 4px black solid;
        padding: 12px;
      "
    >
      <h1 style="font-size: 16px">Draggle</h1>
      <div style="position: relative">
        <div
          style="height: 5px; background-color: #ccc; margin-top: 10px"
        ></div>
        <div
          id="enemyHealthBar"
          style="
            height: 5px;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
          "
        ></div>
      </div>
    </div>

    <!-- Represents health bar of emby (us) -->
    <div
      style="
        background-color: white;
        width: 250px;
        position: absolute;
        top: 330px;
        right: 50px;
        border: 4px black solid;
        padding: 12px;
      "
    >
      <h1 style="font-size: 16px">Emby</h1>
      <div style="position: relative">
        <div
          style="height: 5px; background-color: #ccc; margin-top: 10px"
        ></div>
        <div
          id="playerHealthBar"
          style="
            height: 5px;
            background-color: green;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
          "
        ></div>
      </div>
    </div>

    <div
      style="
        background-color: white;
        height: 140px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 4px black solid;
        display: flex;
      "
    >
      <div
        id="dialogueBox"
        style="
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          background-color: white;
          padding: 12px;
          display: none;
          cursor: pointer;
        "
      >
        sdkfjlsdajl
      </div>
      <div
        id="attacksBox"
        style="
          width: 66.66%;
          display: grid;
          grid-template-columns: repeat(2, 1fr);
        "
      ></div>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 33.33%;
          border-left: 4px black solid;
        "
      >
        <h1 id="attackType" style="font-size: 16px">Attack Type</h1>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var tutorialBox = document.getElementById('tutorialBox');
    var canvas = document.querySelector('canvas');

    if (!tutorialBox) return;

    // Ensure tutorial is visible when the game screen loads
    tutorialBox.style.display = 'block';
    var tutorialVisible = true;

    // Toggle tutorial visibility with the "P" key
    window.addEventListener('keydown', function (event) {
      if (event.key === 'p' || event.key === 'P') {
        tutorialVisible = !tutorialVisible;
        tutorialBox.style.display = tutorialVisible ? 'block' : 'none';
      }
    });

    // Responsive canvas scaling to keep 1024x576 aspect ratio
    if (canvas) {
      var GAME_WIDTH = 1024;
      var GAME_HEIGHT = 576;

      function resizeCanvas() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;

        var scale = Math.min(
          windowWidth / GAME_WIDTH,
          windowHeight / GAME_HEIGHT
        );

        var displayWidth = GAME_WIDTH * scale;
        var displayHeight = GAME_HEIGHT * scale;

        canvas.style.width = displayWidth + 'px';
        canvas.style.height = displayHeight + 'px';
      }

      window.addEventListener('load', resizeCanvas);
      window.addEventListener('resize', resizeCanvas);

      // Initial call in case script runs after load
      resizeCanvas();
    }
  })();
</script>
